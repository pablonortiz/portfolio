repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: mise x -- pnpm exec prettier --check --ignore-unknown
        language: system
        types: [text]
      - id: eslint
        name: eslint
        entry: mise x -- pnpm exec eslint --no-warn-ignored
        language: system
        files: \.(astro|ts|tsx|js|mjs)$
      - id: astro-check
        name: astro check
        entry: mise x -- pnpm check
        language: system
        pass_filenames: false
        files: \.(astro|ts|tsx|js|mjs)$
